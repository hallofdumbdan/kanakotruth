<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth Machine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="brand-title">Truth Machine</h1>
        </header>
        
        <main>
            <section class="card">
                <div class="form-group">
                    <label for="token">Authentication Token</label>
                    <input type="password" id="token" placeholder="Paste your token here...">
                </div >
                <div class="action-bar">
                    <button onclick="startDeployment()" id="start-button" class="btn-primary">Start Deployment</button>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
